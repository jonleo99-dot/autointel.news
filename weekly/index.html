/* RSS.com dynamic latest-episode player */
.audio--embedded {
  display: block;
}

<style id="weekly-preview-teaser-style">
:root{
  --teal:#3ecf8e;
  --red:#e2604f;
}

.signal{
  --signal-color:var(--amber);
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:100%;
  overflow:hidden;
  padding:25px 23px 21px;
  border-color:color-mix(
    in srgb,
    var(--signal-color) 25%,
    var(--line)
  );
  background:
    radial-gradient(
      circle at 92% 4%,
      color-mix(in srgb,var(--signal-color) 9%,transparent),
      transparent 29%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      rgba(255,255,255,.007)
    );
  transition:
    transform .2s ease,
    border-color .2s ease;
}

.signal:nth-child(2){
  --signal-color:var(--teal);
}

.signal:nth-child(3){
  --signal-color:var(--red);
}

.signal::before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  height:3px;
  background:linear-gradient(
    90deg,
    var(--signal-color),
    color-mix(in srgb,var(--signal-color) 18%,transparent) 64%,
    transparent
  );
}

.signal::after{
  content:attr(data-signal-number);
  position:absolute;
  top:15px;
  right:18px;
  color:var(--signal-color);
  font:700 45px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:-.08em;
  opacity:.07;
  pointer-events:none;
}

.signal > *{
  position:relative;
  z-index:1;
}

.signal-topline{
  display:flex;
  align-items:center;
  gap:8px;
  padding-right:50px;
}

.signal-number{
  color:var(--signal-color);
}

.signal-confidence{
  padding:3px 6px;
  border:1px solid color-mix(
    in srgb,
    var(--signal-color) 46%,
    transparent
  );
  border-radius:999px;
  color:var(--signal-color);
  font:700 7.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.signal h3{
  font-size:19px;
  line-height:1.3;
}

.signal p{
  margin-bottom:20px;
}

.signal-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:7px 12px;
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.07);
  color:var(--dim);
  font:700 8px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.signal-footer span:last-child{
  color:var(--signal-color);
}

.audio{
  position:relative;
  overflow:hidden;
  padding:30px;
  border-color:rgba(242,169,59,.3);
  background:
    radial-gradient(
      circle at 90% 0,
      rgba(242,169,59,.12),
      transparent 24rem
    ),
    var(--panel);
}

.audio::before{
  content:"";
  position:absolute;
  inset:0 auto 0 0;
  width:3px;
  background:var(--amber);
}

.audio h3{
  font-size:clamp(23px,3vw,30px);
}

.audio p{
  max-width:680px;
  font-size:14px;
  line-height:1.65;
}

.podcast-cta{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:18px;
  padding:12px 15px;
  border:1px solid var(--amber);
  border-radius:8px;
  background:var(--amber);
  color:#14171c;
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}

.podcast-cta[aria-disabled="true"]{
  border-color:var(--line);
  background:transparent;
  color:var(--dim);
  cursor:default;
}

.podcast-schedule{
  margin-top:10px;
  color:var(--amber);
  font:700 8.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.audio-state{
  border-color:rgba(242,169,59,.35);
  color:var(--amber);
}

@media(hover:hover) and (min-width:761px){
  .signal:hover{
    transform:translateY(-3px);
    border-color:color-mix(
      in srgb,
      var(--signal-color) 48%,
      var(--line)
    );
  }
}

@media(max-width:560px){
  .signal{
    padding:22px 19px 19px;
  }

  .audio{
    padding:24px 20px;
  }
}
</style>
<style id="weekly-preview-hybrid-metrics-style">
.metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  overflow:hidden;
  border:1px solid var(--line);
  border-top:0;
  border-radius:0 0 16px 16px;
  background:
    linear-gradient(
      180deg,
      #171c22,
      #14191f
    );
}

.metrics .metric,
.metrics .metric:first-child{
  display:grid;
  grid-template-columns:minmax(105px,138px) minmax(0,1fr);
  align-items:center;
  gap:22px;
  min-width:0;
  min-height:158px;
  padding:29px 27px;
  border-right:1px solid var(--line);
  border-bottom:0;
}

.metrics .metric:last-child{
  border-right:0;
}

.metrics .number{
  width:100%;
  color:var(--ink);
  font-size:clamp(42px,4.5vw,60px);
  line-height:1;
  text-align:center;
}

.metric-copy{
  min-width:0;
}

.metrics .label{
  margin:0;
  color:var(--amber);
  font-size:11.5px;
  line-height:1.35;
  letter-spacing:.1em;
}

.metric-description{
  max-width:24ch;
  margin-top:8px;
  color:var(--dim);
  font-size:12.5px;
  line-height:1.48;
}

@media(max-width:900px){
  .metrics .metric,
  .metrics .metric:first-child{
    grid-template-columns:1fr;
    align-content:center;
    gap:12px;
    padding:25px 18px;
    text-align:center;
  }

  .metric-description{
    margin:7px auto 0;
  }
}

@media(max-width:560px){
  .metrics{
    grid-template-columns:1fr;
  }

  .metrics .metric,
  .metrics .metric:first-child{
    grid-template-columns:94px minmax(0,1fr);
    gap:15px;
    min-height:0;
    padding:21px 18px;
    border-right:0;
    border-bottom:1px solid var(--line);
    text-align:left;
  }

  .metrics .metric:last-child{
    border-bottom:0;
  }

  .metrics .number{
    font-size:39px;
  }

  .metric-description{
    max-width:none;
    margin:6px 0 0;
  }
}
</style>
