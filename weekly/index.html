<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="AutoIntel Weekly connects hundreds of automotive reports into the signals, risks and opportunities industry professionals need to see.">
  <title>AutoIntel Weekly | Automotive Industry Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101318;
      --bg-deep: #0b0e12;
      --panel: #1b2129;
      --panel-2: #202731;
      --ink: #eef1f4;
      --ink-soft: #d5dae0;
      --dim: #9da6b2;
      --line: #303843;
      --line-soft: rgba(255,255,255,.08);
      --cyan: #35d5eb;
      --cyan-soft: rgba(53,213,235,.12);
      --amber: #f2a93b;
      --amber-soft: rgba(242,169,59,.12);
      --teal: #3ecf8e;
      --red: #e36b5d;
      --shell: 1220px;
      --radius: 20px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 82% 0, rgba(53,213,235,.075), transparent 28rem),
        var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Sans", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { color: inherit; font: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: "Space Grotesk", Arial, sans-serif; }
    img { display: block; max-width: 100%; }
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 4px;
    }

    .shell { width: min(calc(100% - 40px), var(--shell)); margin-inline: auto; }
    .mono { font-family: "IBM Plex Mono", monospace; }
    .anchor-section { scroll-margin-top: 144px; }

    .skip-link {
      position: fixed;
      z-index: 1000;
      top: 10px;
      left: 10px;
      transform: translateY(-160%);
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--cyan);
      color: #061014;
      font-weight: 700;
    }
    .skip-link:focus { transform: translateY(0); }

    .site-header {
      position: sticky;
      z-index: 100;
      top: 0;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16,19,24,.9);
      backdrop-filter: blur(18px);
    }

    .nav-row {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand { display: inline-flex; align-items: center; gap: 12px; min-width: max-content; }
    .brand-mark {
      position: relative;
      width: 88px;
      height: 38px;
      flex: 0 0 88px;
      overflow: hidden;
      border-radius: 7px;
      background: #0e1116;
    }
    .brand-mark img {
      position: absolute;
      top: -28px;
      left: 0;
      width: 88px;
      height: 88px;
      max-width: none;
      object-fit: contain;
    }
    .brand-copy { font: 700 19px/1 "Space Grotesk", sans-serif; letter-spacing: -.02em; }
    .brand-copy small {
      display: block;
      margin-top: 6px;
      color: var(--dim);
      font: 500 9px/1 "IBM Plex Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .primary-nav { display: flex; align-items: center; gap: 25px; color: var(--ink-soft); font-size: 14px; font-weight: 500; }
    .primary-nav a:not(.nav-cta) { transition: color 160ms ease; }
    .primary-nav a:not(.nav-cta):hover { color: var(--cyan); }
    .primary-nav .nav-return { color: var(--dim); }
    .nav-cta, .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 19px;
      border: 1px solid transparent;
      border-radius: 10px;
      font: 700 12px/1 "IBM Plex Mono", monospace;
      letter-spacing: .045em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .nav-cta, .button-primary { background: var(--cyan); color: #061014; }
    .nav-cta { cursor: pointer; }
    .nav-cta:hover, .button:hover { transform: translateY(-2px); }
    .button-secondary { border-color: var(--line); background: rgba(255,255,255,.025); color: var(--ink); }
    .button-secondary:hover { border-color: rgba(53,213,235,.55); background: var(--cyan-soft); }
    .nav-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      cursor: pointer;
    }

    .hero { position: relative; overflow: hidden; padding: 76px 0 0; }
    .hero::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(105deg, rgba(242,169,59,.07), transparent 44%),
        radial-gradient(circle at 74% 20%, rgba(53,213,235,.08), transparent 24rem);
      content: "";
    }
    .hero-grid { display: grid; grid-template-columns: minmax(0,1.06fr) minmax(430px,.94fr); gap: 48px; align-items: stretch; }
    .hero-copy { display: flex; flex-direction: column; justify-content: center; padding: 18px 0; }
    .eyebrow, .section-kicker, .card-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--amber);
      font: 600 10px/1.4 "IBM Plex Mono", monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .eyebrow::before, .section-kicker::before {
      width: 25px;
      height: 2px;
      background: currentColor;
      content: "";
    }
    .hero h1 {
      max-width: 760px;
      margin: 23px 0 23px;
      font-size: clamp(48px,5vw,70px);
      line-height: .99;
      letter-spacing: -.05em;
      text-wrap: balance;
    }
    .hero h1 span { color: var(--cyan); }
    .hero-deck { max-width: 760px; margin-bottom: 28px; color: var(--ink-soft); font-size: 19px; line-height: 1.55; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-note {
      margin: 22px 0 0;
      color: var(--dim);
      font: 500 9px/1.5 "IBM Plex Mono", monospace;
      letter-spacing: .065em;
      text-transform: uppercase;
    }

    .hero-media {
      position: relative;
      min-height: 610px;
      margin: 0;
      align-self: stretch;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .hero-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.75) contrast(1.07) brightness(.63); }
    .hero-media::after { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 18%, rgba(11,14,18,.1) 46%, rgba(11,14,18,.96)); content: ""; }
    .media-overlay {
      position: absolute;
      z-index: 2;
      inset: auto 24px 24px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 15px;
      background: rgba(11,14,18,.72);
      box-shadow: 0 18px 44px rgba(0,0,0,.24);
      backdrop-filter: blur(14px);
    }
    .signal-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin: 14px 0 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 11px;
      background: rgba(255,255,255,.11);
    }
    .signal-stat {
      min-width: 0;
      padding: 14px 12px;
      background: rgba(11,14,18,.86);
    }
    .signal-stat b {
      display: block;
      overflow: hidden;
      color: var(--cyan);
      font: 600 22px/1 "Space Grotesk", sans-serif;
      letter-spacing: -.025em;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .signal-stat span {
      display: block;
      margin-top: 7px;
      color: var(--dim);
      font: 500 7px/1.35 "IBM Plex Mono", monospace;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .theme-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .theme-tags span {
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 99px;
      background: rgba(11,14,18,.56);
      color: var(--ink-soft);
      font: 500 8px/1 "IBM Plex Mono", monospace;
      letter-spacing: .055em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .evidence-bar {
      display: grid;
      grid-template-columns: 1.2fr repeat(3,1fr);
      margin-top: 62px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px 15px 0 0;
      background: var(--panel);
    }
    .evidence-intro, .evidence-stat { min-height: 106px; padding: 23px 25px; border-right: 1px solid var(--line); }
    .evidence-stat:last-child { border-right: 0; }
    .evidence-intro { display: flex; flex-direction: column; justify-content: center; }
    .evidence-intro strong { font-family: "Space Grotesk", sans-serif; font-size: 17px; }
    .evidence-intro span { color: var(--dim); font-size: 12px; }
    .evidence-stat b { display: block; color: var(--cyan); font: 600 34px/1 "Space Grotesk", sans-serif; }
    .evidence-stat span { display: block; margin-top: 9px; color: var(--dim); font: 500 8px/1.45 "IBM Plex Mono", monospace; letter-spacing: .075em; text-transform: uppercase; }

    .edition-nav {
      position: sticky;
      z-index: 80;
      top: 76px;
      border-block: 1px solid var(--line);
      background: rgba(11,14,18,.93);
      backdrop-filter: blur(16px);
    }
    .edition-nav .shell { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
    .edition-nav-label { min-width: max-content; margin-right: 7px; color: var(--dim); font: 600 8px/1 "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
    .edition-nav a { min-width: max-content; padding: 7px 10px; border-radius: 7px; color: var(--ink-soft); font-size: 11px; }
    .edition-nav a:hover { background: var(--cyan-soft); color: var(--cyan); }

    .section { padding: 92px 0; border-bottom: 1px solid var(--line-soft); }
    .section-head { display: grid; grid-template-columns: minmax(0,1fr) minmax(270px,.45fr); gap: 42px; align-items: end; margin-bottom: 39px; }
    .section-head h2 { max-width: 820px; margin: 15px 0 0; font-size: clamp(36px,4.8vw,60px); line-height: 1.01; letter-spacing: -.045em; }
    .section-head p { margin: 0; color: var(--dim); font-size: 14px; }

    .signal-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .signal-card {
      position: relative;
      display: flex;
      min-height: 390px;
      flex-direction: column;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(53,213,235,.055), transparent 48%), var(--panel);
      transition: transform 180ms ease, border-color 180ms ease;
    }
    .signal-card:hover { transform: translateY(-4px); border-color: rgba(53,213,235,.42); }
    .signal-number { display: flex; justify-content: space-between; gap: 15px; color: var(--cyan); font: 600 9px/1.4 "IBM Plex Mono", monospace; letter-spacing: .09em; text-transform: uppercase; }
    .confidence { color: var(--teal); }
    .signal-card h3 { margin: 33px 0 16px; font-size: 26px; line-height: 1.12; letter-spacing: -.035em; }
    .signal-card p { margin-bottom: 24px; color: var(--dim); font-size: 14px; }
    .signal-proof { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line-soft); color: var(--ink-soft); font: 500 9px/1.5 "IBM Plex Mono", monospace; letter-spacing: .055em; text-transform: uppercase; }
    .signal-proof strong { color: var(--amber); font-weight: 600; }

    .deep-dive { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,.95fr); align-items: stretch; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .deep-intro { display: flex; flex-direction: column; justify-content: center; padding: 44px; background: linear-gradient(150deg, rgba(242,169,59,.14), transparent 55%), var(--panel-2); }
    .deep-intro h2 { max-width: 690px; margin: 17px 0 19px; font-size: clamp(34px,3.35vw,46px); line-height: 1.03; letter-spacing: -.043em; text-wrap: balance; }
    .deep-intro p { max-width: 680px; margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.65; }
    .evidence-pill { display: inline-flex; align-self: flex-start; margin-top: 24px; padding: 7px 9px; border-radius: 99px; background: var(--amber-soft); color: var(--amber); font: 600 8px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; text-transform: uppercase; }
    .deep-body { display: grid; grid-template-rows: minmax(0,1fr) minmax(0,1fr) auto; align-content: stretch; gap: 0; padding: 44px; }
    .analysis-block { display: flex; min-height: 0; flex-direction: column; justify-content: center; padding: 27px 0; border-bottom: 1px solid var(--line); }
    .analysis-block:first-child { padding-top: 0; }
    .analysis-block:last-child { padding-bottom: 0; border-bottom: 0; }
    .analysis-block strong { display: block; margin-bottom: 8px; color: var(--cyan); font: 600 9px/1.4 "IBM Plex Mono", monospace; letter-spacing: .09em; text-transform: uppercase; }
    .analysis-block p { margin: 0; color: var(--dim); font-size: 15px; }
    .analysis-block.operator { align-self: end; margin-top: 18px; padding: 21px; border: 1px solid rgba(62,207,142,.24); border-radius: 11px; background: rgba(62,207,142,.07); }
    .analysis-block.operator strong { color: var(--teal); }

    .decision-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .decision-card { padding: 30px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); }
    .decision-card.risk { border-top: 3px solid var(--amber); }
    .decision-card.opportunity { border-top: 3px solid var(--teal); }
    .decision-label { color: var(--dim); font: 600 9px/1 "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
    .risk .decision-label { color: var(--amber); }
    .opportunity .decision-label { color: var(--teal); }
    .decision-card h3 { margin: 17px 0 13px; font-size: 27px; line-height: 1.15; letter-spacing: -.03em; }
    .decision-card p { margin: 0; color: var(--dim); }

    .newsletter-section { padding-block: 58px; background: rgba(8,11,14,.34); }
    .newsletter-panel { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 31px 36px; border: 1px solid rgba(62,207,142,.3); border-radius: var(--radius); background: linear-gradient(110deg,rgba(62,207,142,.09),transparent 55%),var(--panel); }
    .newsletter-panel h2 { margin: 10px 0 8px; font-size: clamp(27px,3vw,36px); line-height: 1.1; letter-spacing: -.035em; }
    .newsletter-panel p { margin: 0; color: var(--ink-soft); font-size: 14px; }
    .newsletter-action { display: grid; justify-items: center; gap: 8px; flex: none; }
    .newsletter-action .button { cursor: pointer; }
    .newsletter-action small { color: var(--dim); font-size: 11px; }

    .access-panel { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(330px,.65fr); overflow: hidden; border: 1px solid rgba(53,213,235,.32); border-radius: var(--radius); background: linear-gradient(120deg, rgba(53,213,235,.1), transparent 52%), var(--panel); box-shadow: var(--shadow); }
    .access-copy { padding: 42px; }
    .access-copy h2 { max-width: 700px; margin: 17px 0 16px; font-size: clamp(37px,4.8vw,58px); line-height: 1.02; letter-spacing: -.045em; }
    .access-copy > p { max-width: 680px; color: var(--ink-soft); }
    .full-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 25px; margin: 28px 0 0; padding: 0; list-style: none; }
    .full-list li { position: relative; padding-left: 20px; color: var(--ink-soft); font-size: 13px; }
    .full-list li::before { position: absolute; left: 0; color: var(--teal); content: "✓"; font-weight: 700; }
    .access-action { display: flex; flex-direction: column; justify-content: center; padding: 36px; border-left: 1px solid var(--line); background: rgba(11,14,18,.48); }
    .price { margin-bottom: 5px; font: 700 38px/1 "Space Grotesk", sans-serif; }
    .price span { color: var(--dim); font: 500 13px/1 "IBM Plex Sans", sans-serif; }
    .trial-note { margin-bottom: 22px; color: var(--teal); font: 600 9px/1.45 "IBM Plex Mono", monospace; letter-spacing: .065em; text-transform: uppercase; }
    .access-action .button { width: 100%; }
    .access-fine { margin: 14px 0 0; color: var(--dim); font-size: 11px; text-align: center; }
    .checkout-message { display: none; margin-top: 15px; padding: 12px; border: 1px solid rgba(53,213,235,.25); border-radius: 9px; background: var(--cyan-soft); color: var(--ink-soft); font-size: 11px; text-align: center; }
    .checkout-message.is-visible { display: block; }

    .listen-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 30px; align-items: center; padding: 34px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); }
    .listen-copy { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 22px; align-items: center; }
    .audio-mark { display: grid; width: 68px; height: 68px; place-items: center; border: 1px solid rgba(242,169,59,.34); border-radius: 50%; background: var(--amber-soft); color: var(--amber); font: 700 14px/1 "IBM Plex Mono", monospace; }
    .listen-card h2 { margin: 8px 0 7px; font-size: 31px; letter-spacing: -.035em; }
    .listen-card p { margin: 0; color: var(--dim); font-size: 13px; }
    .listen-actions { display: flex; gap: 10px; }

    .method-note { margin-top: 18px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255,255,255,.018); }
    .method-note summary { padding: 16px 18px; cursor: pointer; color: var(--ink-soft); font: 600 10px/1.4 "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
    .method-note p { margin: 0; padding: 0 18px 18px; color: var(--dim); font-size: 12px; }

    footer { padding: 45px 0; background: var(--bg-deep); }
    .footer-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .footer-copy strong { font-family: "Space Grotesk", sans-serif; }
    .footer-copy span { display: block; margin-top: 5px; color: var(--dim); font-size: 11px; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 19px; color: var(--dim); font-size: 12px; }
    .footer-links a:hover { color: var(--cyan); }

    .prototype-badge { position: fixed; z-index: 95; right: 14px; bottom: 14px; padding: 8px 10px; border: 1px solid rgba(53,213,235,.3); border-radius: 8px; background: rgba(11,14,18,.9); color: var(--cyan); font: 600 8px/1 "IBM Plex Mono", monospace; letter-spacing: .07em; text-transform: uppercase; backdrop-filter: blur(12px); }
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 520ms ease, transform 520ms ease; }
    .reveal.is-visible { opacity: 1; transform: none; }

    @media (max-width: 1000px) {
      .primary-nav { display: none; position: absolute; top: 76px; right: 20px; left: 20px; align-items: stretch; flex-direction: column; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
      .site-header.is-open .primary-nav { display: flex; }
      .nav-toggle { display: inline-grid; place-items: center; }
      .hero-grid { grid-template-columns: 1fr; }
      .hero-copy { padding: 0; }
      .hero-media { min-height: 410px; }
      .evidence-bar { grid-template-columns: 1fr 1fr; }
      .evidence-intro, .evidence-stat { border-bottom: 1px solid var(--line); }
      .signal-grid { grid-template-columns: 1fr; }
      .signal-card { min-height: 0; }
      .deep-dive, .access-panel { grid-template-columns: 1fr; }
      .access-action { border-top: 1px solid var(--line); border-left: 0; }
      .listen-card { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .shell { width: min(calc(100% - 28px), var(--shell)); }
      .hero { padding-top: 54px; }
      .hero h1 { font-size: clamp(44px,15vw,62px); }
      .hero-deck { font-size: 17px; }
      .hero-actions .button { width: 100%; }
      .hero-media { min-height: 360px; }
      .media-overlay { inset: auto 16px 16px; padding: 16px; }
      .signal-stat { padding: 12px 9px; }
      .signal-stat b { font-size: 18px; }
      .evidence-bar { grid-template-columns: 1fr; border-radius: 13px 13px 0 0; }
      .evidence-intro, .evidence-stat { min-height: 0; border-right: 0; }
      .edition-nav { top: 76px; }
      .section { padding: 70px 0; }
      .section-head { grid-template-columns: 1fr; gap: 16px; }
      .signal-card, .deep-intro, .deep-body, .decision-card, .access-copy, .access-action, .listen-card { padding: 24px; }
      .decision-grid, .full-list { grid-template-columns: 1fr; }
      .newsletter-panel { align-items: flex-start; flex-direction: column; padding: 26px 24px; }
      .newsletter-action { width: 100%; justify-items: stretch; }
      .newsletter-action .button { width: 100%; }
      .listen-copy { grid-template-columns: 1fr; }
      .listen-actions { flex-direction: column; }
      .listen-actions .button { width: 100%; }
      .footer-row { align-items: flex-start; flex-direction: column; }
      .prototype-badge { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
  </style>

  <meta name="autointel-release" content="weekly-cro-v1">
  <style id="weekly-cro-runtime-style">

  <script id="autointel-weekly-cro-renderer">
  (function () {
    'use strict';

    const CONFIG = {
      dataUrls: ['data/weekly_preview.json', '/data/weekly_preview.json'],
      checkoutUrl: 'https://buy.stripe.com/aFa28rcQ4eUBdLA1rz43S00',
      podcast: {
        appleUrl: 'https://podcasts.apple.com/us/podcast/autointel-news-weekly/id6807033776'
      }
    };

    const esc = function (value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    function issueDate(raw) {
      const dates = String(raw || '').match(/\d{4}-\d{2}-\d{2}/g);
      const ending = dates && dates.length ? dates[dates.length - 1] : '';
      if (!ending) return raw || 'Current reporting week';
      const date = new Date(ending + 'T00:00:00Z');
      return 'Week ending ' + new Intl.DateTimeFormat(
        'en-US',
        {month:'long', day:'numeric', year:'numeric', timeZone:'UTC'}
      ).format(date);
    }

    async function loadData() {
      let lastError;
      for (const url of CONFIG.dataUrls) {
        try {
          const response = await fetch(url, {cache:'no-store'});
          if (!response.ok) throw new Error(url + ' returned ' + response.status);
          return await response.json();
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('Preview data could not be loaded.');
    }

    function renderSignals(signals) {
      return signals.slice(0, 3).map(function (signal, index) {
        const number = String(index + 1).padStart(2, '0');
        const confidence = String(signal.confidence || '').trim();
        const reports = Number(signal.evidence_count || 0);
        const type = String(signal.signal_type || 'Industry signal').trim();
        return '<article class="signal-card reveal">'
          + '<div class="signal-number"><span>Signal ' + number + '</span>'
          + (confidence ? '<span class="confidence">' + esc(confidence) + ' confidence</span>' : '')
          + '</div><h3>' + esc(signal.title || 'Developing signal') + '</h3>'
          + '<p>' + esc(signal.teaser || '') + '</p>'
          + '<div class="signal-proof"><strong>'
          + (reports ? reports + ' supporting report' + (reports === 1 ? '' : 's') : 'Developing evidence')
          + '</strong> · ' + esc(type) + '</div></article>';
      }).join('');
    }

    function render(data) {
      const issue = issueDate(data.reporting_week);
      const metrics = data.metrics || {};
      const lead = data.lead_development || {};
      const signals = Array.isArray(data.signals) ? data.signals : [];
      const decision = data.decision_support_preview || {};
      const downside = decision.downside || {};
      const upside = decision.upside || {};
      const confidence = String(lead.confidence || '').trim();
      const evidenceCount = Number(lead.evidence_count || 0);
      const fullItems = Array.isArray(data.full_briefing_includes)
        ? data.full_briefing_includes
        : [];
      const hasAudioItem = fullItems.some(function (item) {
        return /audio/i.test(String(item || ''));
      });
      const signalTypes = signals.slice(0, 3).map(function (signal) {
        return '<span>' + esc(signal.signal_type || 'Industry signal') + '</span>';
      }).join('');
      const checkoutReady = /^https:\/\/(buy|checkout)\.stripe\.com\//.test(CONFIG.checkoutUrl);
      const checkoutHref = checkoutReady ? CONFIG.checkoutUrl : '#checkout-unavailable';

      document.title = 'AutoIntel Weekly — ' + issue;
      document.getElementById('main').innerHTML = `
        <section class="hero anchor-section" id="top">
          <div class="shell">
            <div class="hero-grid">
              <div class="hero-copy reveal">
                <div class="eyebrow">AutoIntel Weekly · ${esc(issue)}</div>
                <h1>${esc(lead.title || 'The week’s automotive signals, connected.')}</h1>
                <p class="hero-deck">${esc(lead.why_it_matters || data.executive_preview || 'One connected view of what changed and what may change next.')}</p>
                <div class="hero-actions">
                  <button type="button" class="button button-primary ml-onclick-form" onclick="window.ml('show', 'EQNBDs', true)" aria-haspopup="dialog" data-track-location="weekly_hero_newsletter">Sign up for the free weekly email →</button>
                  <a class="button button-secondary" href="#signals">Read this week’s preview</a>
                </div>
                <p class="hero-note">Public preview by email · No payment or card required · Full Briefing trial is a separate choice</p>
              </div>
              <figure class="hero-media reveal" aria-labelledby="weekly-image-caption">
                <img src="/assets/images/weekly-governing-signal.webp" width="960" height="640" alt="Automotive manufacturing equipment and vehicles in a modern production environment" fetchpriority="high" decoding="async">
                <figcaption class="media-overlay" id="weekly-image-caption">
                  <div class="card-label">Governing signal · evidence</div>
                  <div class="signal-stat-grid" aria-label="Evidence supporting the governing signal">
                    <div class="signal-stat"><b>${evidenceCount || '—'}</b><span>Supporting reports</span></div>
                    <div class="signal-stat"><b>${esc(confidence || '—')}</b><span>Confidence</span></div>
                    <div class="signal-stat"><b>${signals.slice(0, 3).length}</b><span>Signals surfaced</span></div>
                  </div>
                  <div class="theme-tags">${signalTypes}</div>
                </figcaption>
              </figure>
            </div>
            <div class="evidence-bar reveal" aria-label="Evidence behind this weekly edition">
              <div class="evidence-intro"><strong>One connected view of the week.</strong><span>Evidence first. Implications second.</span></div>
              <div class="evidence-stat"><b>${esc(metrics.article_count == null ? '—' : metrics.article_count)}</b><span>Reports analyzed</span></div>
              <div class="evidence-stat"><b>${esc(metrics.major_development_count == null ? '—' : metrics.major_development_count)}</b><span>High-impact developments</span></div>
              <div class="evidence-stat"><b>${esc(metrics.cross_source_count == null ? '—' : metrics.cross_source_count)}</b><span>Cross-source confirmations</span></div>
            </div>
          </div>
        </section>
        <nav class="edition-nav" aria-label="Jump through this weekly edition">
          <div class="shell"><span class="edition-nav-label">This edition</span><a href="#signals">Three signals</a><a href="#deep-dive">Deep dive</a><a href="#decision">Risk + opportunity</a><a href="#newsletter">Free newsletter</a><a href="#access">Full briefing</a><a href="#listen">Listen</a></div>
        </nav>
        <section class="section anchor-section" id="signals">
          <div class="shell"><div class="section-head reveal"><div><div class="section-kicker">What changed</div><h2>Three signals carrying the week.</h2></div><p>Each signal is supported across multiple reports. The point is not to repeat the headlines—it is to show where separate developments are beginning to converge.</p></div><div class="signal-grid">${renderSignals(signals)}</div></div>
        </section>
        <section class="section anchor-section" id="deep-dive">
          <div class="shell"><article class="deep-dive reveal"><div class="deep-intro"><div class="section-kicker">One analysis unlocked</div><h2>${esc(lead.title || 'One development worth understanding now')}</h2><p>${esc(data.executive_preview || '')}</p><span class="evidence-pill">${evidenceCount ? evidenceCount + ' supporting report' + (evidenceCount === 1 ? '' : 's') : 'Evidence developing'}${confidence ? ' · ' + esc(confidence) + ' confidence' : ''}</span></div><div class="deep-body">${lead.what_happened ? '<div class="analysis-block"><strong>What happened</strong><p>' + esc(lead.what_happened) + '</p></div>' : ''}${lead.why_it_matters ? '<div class="analysis-block"><strong>Why it matters</strong><p>' + esc(lead.why_it_matters) + '</p></div>' : ''}<div class="analysis-block operator"><strong>How to use this preview</strong><p>Compare this development with the three signals and decision layer below. The complete briefing adds the supporting evidence, implications and forward watchlist.</p></div></div></article></div>
        </section>
        <section class="section anchor-section" id="decision">
          <div class="shell"><div class="section-head reveal"><div><div class="section-kicker">Decision layer</div><h2>The downside and upside taking shape.</h2></div><p>The public preview surfaces one risk and one opportunity. The complete briefing carries the analysis through to evidence and forward indicators.</p></div><div class="decision-grid">${downside.title ? '<article class="decision-card risk reveal"><div class="decision-label">Risk signal</div><h3>' + esc(downside.title) + '</h3><p>' + esc(downside.teaser || '') + '</p></article>' : ''}${upside.title ? '<article class="decision-card opportunity reveal"><div class="decision-label">Opportunity signal</div><h3>' + esc(upside.title) + '</h3><p>' + esc(upside.teaser || '') + '</p></article>' : ''}</div></div>
        </section>
        <section class="section newsletter-section anchor-section" id="newsletter">
          <div class="shell"><div class="newsletter-panel reveal"><div><div class="section-kicker">Free weekly preview email</div><h2>Get the public edition in your inbox.</h2><p>The free weekly email brings the public preview to you. Full Briefing offers may appear occasionally; subscribing to email does not start a paid trial.</p></div><div class="newsletter-action"><button type="button" class="button button-secondary ml-onclick-form" onclick="window.ml('show', 'EQNBDs', true)" aria-haspopup="dialog" data-track-location="weekly_newsletter">Sign up for the free weekly email →</button><small>No payment or card required · Unsubscribe anytime</small></div></div></div>
        </section>
        <section class="section anchor-section" id="access">
          <div class="shell"><div class="access-panel reveal"><div class="access-copy"><div class="section-kicker">The Full Briefing</div><h2>Move from awareness to decision-ready intelligence.</h2><p>The public preview establishes the week’s direction. The complete briefing adds the implications, evidence and forward watchlist needed to use it.</p><ul class="full-list">${fullItems.map(function (item) { return '<li>' + esc(item) + '</li>'; }).join('')}${hasAudioItem ? '' : '<li>The private audio briefing</li>'}</ul></div><div class="access-action"><div class="price">$9.99 <span>/ month</span></div><div class="trial-note">30 days free · No credit card required</div><a class="button button-primary" id="trialButton" href="${esc(checkoutHref)}" ${checkoutReady ? 'data-track-event="begin_checkout"' : 'aria-disabled="true"'} data-track-location="weekly_access_panel">Start your 30-day free trial →</a><p class="access-fine">No automatic charge · Continue afterward for $9.99/month · Cancel anytime</p><div class="checkout-message${checkoutReady ? '' : ' is-visible'}" id="checkoutMessage" role="status">${checkoutReady ? '' : 'Checkout link awaiting final production configuration.'}</div></div></div></div>
        </section>
        <section class="section anchor-section" id="listen">
          <div class="shell"><div class="listen-card reveal"><div class="listen-copy"><div class="audio-mark" aria-hidden="true">▶</div><div><div class="card-label">Public weekly podcast</div><h2>Hear the week’s essential signals.</h2><p>A concise sample of the editorial approach for the drive, desk or Monday-morning briefing.</p></div></div><div class="listen-actions"><a class="button button-primary" href="${esc(CONFIG.podcast.appleUrl)}" target="_blank" rel="noopener noreferrer" data-track-event="podcast_click" data-track-location="weekly_listen">Apple Podcasts ↗</a><a class="button button-secondary" href="/" data-track-event="daily_intelligence_click" data-track-location="weekly_listen">Daily intelligence →</a></div></div><details class="method-note reveal"><summary>How AutoIntel builds the weekly view</summary><p>AutoIntel scans automotive reporting across the industry, connects recurring developments and contradictions, then interprets the implications and forward indicators. The method is available here for trust and context without interrupting the edition’s primary reading path.</p></details></div>
        </section>`;

      document.getElementById('loading').remove();
      document.getElementById('main').hidden = false;
      document.getElementById('weeklyFooter').hidden = false;
      installInteractions();
    }

    function installInteractions() {
      const header = document.getElementById('siteHeader');
      const toggle = document.getElementById('navToggle');
      const navigation = document.getElementById('primaryNav');
      if (header && toggle && navigation) {
        toggle.addEventListener('click', function () {
          const open = header.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
        });
        navigation.addEventListener('click', function (event) {
          if (event.target.closest('a, button')) {
            header.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', 'Open navigation');
          }
        });
      }

      const trialButton = document.getElementById('trialButton');
      if (trialButton && trialButton.getAttribute('aria-disabled') === 'true') {
        trialButton.addEventListener('click', function (event) { event.preventDefault(); });
      }

      const items = Array.from(document.querySelectorAll('.reveal'));
      if (!('IntersectionObserver' in window)) {
        items.forEach(function (item) { item.classList.add('is-visible'); });
        return;
      }
      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, {threshold:.08, rootMargin:'0px 0px -35px'});
      items.forEach(function (item) { observer.observe(item); });
    }

    loadData().then(render).catch(function (error) {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
      const box = document.createElement('div');
      box.className = 'error';
      box.textContent = 'AUTOINTEL WEEKLY PREVIEW\n\nUnable to load the public preview.\n\n' + error.message;
      document.body.appendChild(box);
    });
  })();
  </script>

  <script id="autointel-ga4-early-access-tracking">
  (function () {
    'use strict';
    const measurementId = 'G-GFL6J09QZV';
    const mailerLiteFormId = 'EQNBDs';
    const hostname = window.location.hostname.toLowerCase();
    const isProduction = hostname === 'autointel.news' || hostname === 'www.autointel.news';
    const pageType = 'weekly_preview';

    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };

    if (isProduction) {
      const existingLoader = document.querySelector('script[src*="googletagmanager.com/gtag/js"]');
      if (!existingLoader) {
        const loader = document.createElement('script');
        loader.async = true;
        loader.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
        document.head.appendChild(loader);
      }
      window.gtag('js', new Date());
      window.gtag('config', measurementId);
    }

    function sendEvent(eventName, parameters) {
      if (isProduction) {
        window.gtag('event', eventName, parameters);
      } else {
        console.info('[AutoIntel GA4 preview]', eventName, parameters);
      }
    }
    window.autoIntelTrack = sendEvent;

    document.addEventListener('click', function (event) {
      const origin = event.target instanceof Element ? event.target : null;
      const tracked = origin ? origin.closest('[data-track-event]') : null;
      if (tracked && tracked.getAttribute('aria-disabled') !== 'true') {
        sendEvent(tracked.dataset.trackEvent, {
          link_location: tracked.dataset.trackLocation || pageType,
          link_url: tracked.getAttribute('href') || '',
          page_type: pageType
        });
      }
      const formTrigger = origin ? origin.closest('.ml-onclick-form') : null;
      if (formTrigger) {
        sendEvent('early_access_form_open', {
          form_id: mailerLiteFormId,
          form_name: 'autointel_weekly_early_access',
          form_location: formTrigger.dataset.trackLocation || pageType,
          page_type: pageType
        });
      }
    }, true);

    const currentUrl = new URL(window.location.href);
    if (currentUrl.searchParams.get('early_access') === 'confirmed') {
      sendEvent('confirmation_page_view', {
        form_id: mailerLiteFormId,
        form_name: 'autointel_weekly_early_access',
        confirmation_source: 'mailerlite_double_opt_in',
        confirmation_status: 'redirect_received',
        page_type: pageType
      });
      currentUrl.searchParams.delete('early_access');
      const remainingQuery = currentUrl.searchParams.toString();
      const cleanedUrl = currentUrl.pathname + (remainingQuery ? '?' + remainingQuery : '') + currentUrl.hash;
      window.history.replaceState({}, document.title, cleanedUrl);
    }
  })();
  </script>
